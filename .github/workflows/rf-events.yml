name: Update RF Luma events feed
on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rf-events
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build rf-events.json
        env:
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
        run: python3 rf_events.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rf-events.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "rf-events: $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
